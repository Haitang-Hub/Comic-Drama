server:
  port: 8103

spring:
  application:
    name: comic-task-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/comic_drama?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  is-concurrent: true
  is-share: false
  jwt-secret-key: comic-drama-jwt-secret-2026-phase1-change-in-prod
  is-log: false

upload:
  avatar-path: /data/avatars

# Phase-1 最小执行链路：内存队列轮询间隔（毫秒）
task:
  queue:
    poll-interval-ms: 1000

# 工作流服务地址
workflow:
  service:
    url: http://127.0.0.1:8104
    connect-timeout: 5000
    read-timeout: 300000

logging:
  level:
    com.comicdrama: info

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
