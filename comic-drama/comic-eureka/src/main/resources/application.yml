server:
  port: 8761

spring:
  application:
    name: comic-eureka

eureka:
  instance:
    hostname: 127.0.0.1
    prefer-ip-address: false
  client:
    # 单节点：不向自己注册、不拉取注册表
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/
  server:
    # 开发期关闭自我保护，便于实例下线即时清理
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
